$kind: http-request
url: http://localhost:5000/api/auth/login
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"qasim@gmail.com\",\r

    \    \"password\": \"123456\"\r

    }"
scripts:
  - type: afterResponse
    code: "if (pm.response.code === 200) {\r

      \  const responseBody = pm.response.json();\r

      \r

      \  pm.collectionVariables.set(\r

      \    \"accessToken\",\r

      \    responseBody.data.token,\r

      \  );\r

      }"
    language: text/javascript
order: 1000
